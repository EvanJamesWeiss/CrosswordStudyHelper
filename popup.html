<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      body { width: 200px; font-family: sans-serif; text-align: center; padding: 10px; }
      button { 
        background: #4285f4; 
        color: white; 
        border: none; 
        padding: 8px 12px; 
        margin: 5px; 
        cursor: pointer; 
        border-radius: 4px; 
        width: 100%;
      }
      button:hover { background: #357ae8; }
    </style>
    <title>Crossword Study Helper</title>
  </head>
  <body>
    <h3>Crossword Helper</h3>
    <button id="recordBtn">Record Clue</button>
    <button id="doneBtn">Done</button>
    <div id="status" style="margin-top: 10px; font-size: 0.9em; color: #555;"></div>
    <script src="popup.js"></script>
  </body>
</html>
